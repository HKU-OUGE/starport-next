<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'"><title>Starport · 输入法测试</title><style>body{max-width:780px;margin:48px auto;padding:0 24px;font:17px system-ui;color:#203049;background:#f6f8fc}h1{font-size:28px}label{display:block;margin:24px 0 8px}textarea,input{box-sizing:border-box;width:100%;padding:14px;font:22px sans-serif;border:1px solid #bbc8db;border-radius:8px;background:white}pre{white-space:pre-wrap;background:#e9eef6;padding:18px;border-radius:8px}small{color:#536477}</style><h1>Starport · 输入法测试</h1><p>输入 <code>ceshi</code>，确认候选窗出现，选词后应显示「測試」。Ctrl + Space 切换英文；简体由输入法菜单或面板手动选择。</p><label for="text">普通文本</label><textarea id="text" rows="3" placeholder="在这里输入；内容不会发送或保存。" autofocus></textarea><label for="second">另一个输入框</label><input id="second" placeholder="检查输入上下文切换"><label>已提交的文本</label><pre id="result">等待输入</pre><small>本页面不联网、不保存按键，不发送 Claude 消息。关闭后测试内容消失。</small><script>const backend=new URLSearchParams(location.search).get('backend');if(['x11','wayland'].includes(backend)){const label=backend==='x11'?'X11 / XWayland':'Wayland';document.title='Starport · '+label+' 对比';document.querySelector('h1').textContent=label+' · 输入与显示对比';}const t=document.querySelector('#text'),r=document.querySelector('#result');let composing=false;t.addEventListener('compositionstart',()=>composing=true);t.addEventListener('compositionend',()=>{composing=false;r.textContent=t.value||'等待输入'});t.addEventListener('input',()=>{if(!composing)r.textContent=t.value||'等待输入'});</script></html>
